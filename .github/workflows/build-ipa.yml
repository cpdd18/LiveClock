name: Build Signed IPA

# 在 Windows 上只维护源码；触发本工作流后，云端 macOS runner 完成编译与签名。
#
# 三种模式（Run workflow 时选择）：
#   compile-only       无证书：模拟器 Debug 构建，只验证代码能否编译通过
#   simulator-preview  无证书：构建并在模拟器启动 App，自动截图上传，用于自测 UI
#   signed-ipa         导入证书与描述文件，archive + export 产出签名 IPA（需先配好 Secrets）
#
# 触发方式（Windows 装 GitHub CLI 后）：
#   gh workflow run build-ipa.yml -f mode=compile-only
#   gh workflow run build-ipa.yml -f mode=simulator-preview
#   gh workflow run build-ipa.yml -f mode=signed-ipa -f build_number=1
# 或在仓库 Actions 页面手动点 Run workflow。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile-only=编译校验；simulator-preview=模拟器截图自测；signed-ipa=签名导出 IPA"
        default: compile-only
        type: choice
        options:
          - compile-only
          - simulator-preview
          - signed-ipa
      build_number:
        description: "构建号 CFBundleVersion（整数，递增，仅 signed-ipa 使用）"
        default: "1"
      export_method:
        description: "development=自用调试直装；ad-hoc=注册设备后分发（仅 signed-ipa 使用）"
        default: development
        type: choice
        options:
          - development
          - ad-hoc

env:
  # 以下值来自 GitHub Repository Secrets（Settings → Secrets and variables → Actions）
  DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
  APP_PROFILE_NAME: ${{ secrets.APP_PROFILE_NAME }}
  WIDGET_PROFILE_NAME: ${{ secrets.WIDGET_PROFILE_NAME }}

jobs:
  # ---------- 模式一：无证书编译校验（模拟器 Debug，不签名） ----------
  compile-check:
    if: ${{ inputs.mode == 'compile-only' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest usable Xcode
        run: |
          set -euo pipefail
          chosen=""
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then chosen="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator (no signing)
        run: |
          set -euo pipefail
          sim_name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          if [ -z "$sim_name" ]; then
            sim_name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+" | sort -Vr | head -1)
          fi
          echo "Use simulator: $sim_name"
          xcodebuild build \
            -scheme LiveClock \
            -destination "platform=iOS Simulator,name=$sim_name" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/derivedData

  # ---------- 模式：模拟器预览截图（无证书，自测 UI 布局） ----------
  simulator-preview:
    if: ${{ inputs.mode == 'simulator-preview' }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest usable Xcode
        run: |
          set -euo pipefail
          chosen=""
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then chosen="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot a usable iPhone simulator
        run: |
          set -euo pipefail
          sim_name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | sort -Vr | head -1)
          if [ -z "$sim_name" ]; then
            sim_name=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+" | sort -Vr | head -1)
          fi
          udid=$(xcrun simctl list devices available | grep "$sim_name" | head -1 | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f-]{20,}")
          echo "SIM_NAME=$sim_name" >> "$GITHUB_ENV"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "Booting $sim_name ($udid)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build app for simulator
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme LiveClock \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/dd

      - name: Install, launch and capture screenshots
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "LiveClock.app" | head -1)
          BUNDLE_ID=$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER: *//p' project.yml | head -1 | tr -d ' ')
          echo "Installing $APP ($BUNDLE_ID)"
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 5
          mkdir -p shots
          xcrun simctl io "$SIM_UDID" screenshot shots/01-home.png
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot shots/02-home-after-3s.png
          ls -la shots

      - name: Upload simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: LiveClock-simulator-screenshots
          path: shots/*.png
          retention-days: 30

  # ---------- 模式二：签名导出 IPA（需要证书与描述文件 Secrets） ----------
  build:
    if: ${{ inputs.mode == 'signed-ipa' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest usable Xcode
        run: |
          set -euo pipefail
          chosen=""
          for app in $(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -Vr); do
            if [ -d "$app/Contents/Developer" ]; then chosen="$app"; break; fi
          done
          if [ -z "$chosen" ]; then chosen="/Applications/Xcode.app"; fi
          sudo xcode-select -s "$chosen/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version

      - name: Resolve signing identity
        run: |
          if [ "${{ inputs.export_method }}" = "ad-hoc" ]; then
            echo "APP_SIGN_IDENTITY=iPhone Distribution" >> "$GITHUB_ENV"
            echo "WIDGET_SIGN_IDENTITY=iPhone Distribution" >> "$GITHUB_ENV"
          else
            echo "APP_SIGN_IDENTITY=iPhone Developer" >> "$GITHUB_ENV"
            echo "WIDGET_SIGN_IDENTITY=iPhone Developer" >> "$GITHUB_ENV"
          fi

      - name: Import signing certificate into temporary keychain
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="ci-$(date +%s)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          # 关键：必须授予 codesign 分区列表权限，否则 codesign 会卡在无人应答的 GUI 弹窗导致超时
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

      - name: Install provisioning profiles
        env:
          APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APP_PROFILE_BASE64"  | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"
          echo "$WIDGET_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/widget.mobileprovision"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Render export options plist
        run: |
          sed -e "s#__APP_PROFILE_NAME__#${APP_PROFILE_NAME}#" \
              -e "s#__WIDGET_PROFILE_NAME__#${WIDGET_PROFILE_NAME}#" \
              -e "s#<string>development</string>#<string>${{ inputs.export_method }}</string>#" \
              scripts/exportOptions.template.plist > "$RUNNER_TEMP/exportOptions.plist"
          cat "$RUNNER_TEMP/exportOptions.plist"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme LiveClock \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LiveClock.xcarchive" \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_IDENTITY="$APP_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$APP_PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LiveClock.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveClock-${{ inputs.export_method }}-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
